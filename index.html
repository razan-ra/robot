<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Control Pad & Voice Control</title>
<style>
 body {
   display: flex;
   flex-direction: column;
   justify-content: center;
   align-items: center;
   min-height: 100vh;
   margin: 0;
   background: #f9f9f9;
   font-family: Arial, Helvetica, sans-serif;
 }

 h2 { color: #333; margin-bottom: 20px; }

 .control-pad {
   display: grid;
   grid-template-columns: repeat(3, 120px);
   grid-template-rows: repeat(3, 70px);
   gap: 20px;
   justify-items: center;
   align-items: center;
   direction: ltr;
 }

 .btn {
   width: 100%;
   height: 100%;
   border: 2px solid #ccc;
   border-radius: 12px;
   background: #fff;
   font-size: 18px;
   font-weight: bold;
   color: #222;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   transition: 0.2s ease;
 }

 .btn:hover { background: #f5f5f5; }
 .btn.stop { border-color: red; color: red; }

 .forward { grid-column: 2; grid-row: 1; }
 .left { grid-column: 1; grid-row: 2; }
 .stop { grid-column: 2; grid-row: 2; }
 .right { grid-column: 3; grid-row: 2; }
 .backward { grid-column: 2; grid-row: 3; }

 /* تصميم قسم التحكم الصوتي */
 .voice-section {
   margin-top: 30px;
   display: flex;
   flex-direction: column;
   align-items: center;
   gap: 10px;
 }

 .mic-btn {
   padding: 12px 24px;
   background-color: #007bff;
   color: white;
   border: none;
   border-radius: 25px;
   font-size: 16px;
   font-weight: bold;
   cursor: pointer;
   transition: 0.3s;
 }

 .mic-btn.listening {
   background-color: #dc3545;
   animation: pulse 1.5s infinite;
 }

 @keyframes pulse {
   0% { opacity: 1; }
   50% { opacity: 0.5; }
   100% { opacity: 1; }
 }

 #recognized-text {
   font-size: 15px;
   color: #555;
   font-style: italic;
 }

 #status {
   margin-top: 20px;
   font-size: 16px;
   font-weight: bold;
   color: #444;
 }
</style>
</head>
<body>

 <h2>لوحة التحكم في الروبوت</h2>

 <!-- لوحة التحكم بالأزرار -->
 <div class="control-pad">
   <button class="btn forward" onclick="sendCommand('forward')">forward</button>
   <button class="btn left" onclick="sendCommand('left')">left</button>
   <button class="btn stop" onclick="sendCommand('stop')">stop</button>
   <button class="btn right" onclick="sendCommand('right')">right</button>
   <button class="btn backward" onclick="sendCommand('backward')">backward</button>
 </div>

 <!-- قسم تحويل الصوت إلى نص (Speech to Text) -->
 <div class="voice-section">
   <button id="micBtn" class="mic-btn" onclick="startVoiceRecognition()">🎙️ تحدث بالأمر (Voice Control)</button>
   <div id="recognized-text">النص المسموع: -</div>
 </div>

 <div id="status">جاهز</div>

 <script>
 // 1. دالة إرسال الأمر عبر Fetch
 function sendCommand(cmd) {
   document.getElementById('status').innerText = 'جاري الإرسال...';

   fetch('update_command.php', {
     method: 'POST',
     headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
     body: 'command=' + encodeURIComponent(cmd)
   })
   .then(res => res.json())
   .then(data => {
     if (data.status === 'success') {
       document.getElementById('status').innerText =
         'تم التحديث بنجاح: ' + data.button + ' -> "' + data.stored_as + '"';
     } else {
       document.getElementById('status').innerText = 'خطأ: ' + data.message;
     }
   })
   .catch(err => {
     document.getElementById('status').innerText = 'فشل الاتصال بالسيرفر';
   });
 }

 // 2. دالة تحويل الصوت إلى نص (Speech to Text)
 function startVoiceRecognition() {
   const micBtn = document.getElementById('micBtn');
   const textDisplay = document.getElementById('recognized-text');

   // التحقق من دعم المتصفح للخاصية
   const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
   if (!SpeechRecognition) {
     alert("متصفحك لا يدعم خاصية تحويل الصوت إلى نص. يفضل استخدام Google Chrome.");
     return;
   }

   const recognition = new SpeechRecognition();
   recognition.lang = 'en-US'; // تعيين اللغة بالإنجليزية للتوافق مع الأوامر (forward, left, etc.)
   recognition.interimResults = false;

   recognition.onstart = function() {
     micBtn.classList.add('listening');
     micBtn.innerText = "🔴 جاري الاستماع...";
     textDisplay.innerText = "تحدث الآن...";
   };

   recognition.onresult = function(event) {
     const spokenText = event.results[0][0].transcript.toLowerCase().trim();
     textDisplay.innerText = "النص المسموع: " + spokenText;
     
     // تحليل النص المسموع واستخراج الأمر
     let commandToSend = "";
     if (spokenText.includes("forward") || spokenText.includes("front") || spokenText.includes("go")) {
       commandToSend = "forward";
     } else if (spokenText.includes("backward") || spokenText.includes("back")) {
       commandToSend = "backward";
     } else if (spokenText.includes("left")) {
       commandToSend = "left";
     } else if (spokenText.includes("right")) {
       commandToSend = "right";
     } else if (spokenText.includes("stop")) {
       commandToSend = "stop";
     } else {
       document.getElementById('status').innerText = 'لم يتم التعرف على أمر منطقي!';
       return;
     }

     // إرسال الأمر الناتج عن الصوت إلى قاعدة البيانات
     sendCommand(commandToSend);
   };

   recognition.onerror = function(event) {
     textDisplay.innerText = "حدث خطأ أثناء التعرف على الصوت: " + event.error;
   };

   recognition.onend = function() {
     micBtn.classList.remove('listening');
     micBtn.innerText = "🎙️ تحدث بالأمر (Voice Control)";
   };

   recognition.start();
 }
 </script>

</body>
</html>
